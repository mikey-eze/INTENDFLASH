services:
  - type: web
    name: intendflash
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:init
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
